{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicha Barber Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/x-icon">
</head>

<body class="back {% if user.is_authenticated and user.tema == 'light' %}theme-light{% else %}theme-dark{% endif %}">

    {% include 'partials/header.html' %}

    <main class="d-flex flex-column">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <!-- ========================= -->
    <!-- CHAT IA - Diseño Elegante -->
    <!-- ========================= -->

    <div id="chatWidget"
         class="card shadow-lg border-0 position-fixed chat-widget"
         style="width:380px;height:500px;bottom:90px;right:20px;z-index:9999;border-radius:16px;overflow:hidden;display:none;">

        <!-- Header con gradiente -->
        <div class="card-header chat-header d-flex justify-content-between align-items-center py-3 px-3">

            <div class="d-flex align-items-center gap-2">
                <div class="chat-avatar">
                    <i class="bi bi-robot fs-5"></i>
                </div>
                <div>
                    <span class="fw-bold chat-title">ChichaBot</span>
                    <small class="d-block chat-status">🟢 En línea</small>
                </div>
            </div>

            <div class="d-flex gap-2">

                <button type="button"
                        id="btnMinimizar"
                        onclick="toggleMinimizar()"
                        class="btn btn-sm text-white-50 p-1 chat-btn"
                        title="Minimizar">
                    <i class="bi bi-dash-lg" id="iconMinimizar"></i>
                </button>

                <button type="button"
                        onclick="cerrarChat()"
                        class="btn btn-sm text-white-50 p-1 chat-btn"
                        title="Cerrar chat">
                    <i class="bi bi-x-lg"></i>
                </button>

            </div>

        </div>

        <!-- Mensajes -->
        <div id="chatMessages"
             class="card-body p-3 d-flex flex-column chat-body"
             style="height:360px;overflow-y:auto;">
            <!-- Los mensajes se cargarán dinámicamente -->
            <div class="text-center py-5" id="chatLoading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="text-muted small mt-2">Conectando con ChichaBot...</p>
            </div>
        </div>

        <!-- Formulario -->
        <form id="chatForm"
              class="p-3 chat-footer border-top">

            {% csrf_token %}

            <div class="input-group">
                <input
                    type="text"
                    id="pregunta"
                    name="pregunta"
                    class="form-control chat-input"
                    placeholder="Escribe un mensaje..."
                    required
                    autocomplete="off">

                <button type="submit"
                        class="btn chat-send-btn">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>

        </form>

    </div>

    <!-- Botón flotante abrir chat -->
    <button id="openChatBtn"
            onclick="abrirChat()"
            class="btn shadow chat-fab position-fixed d-flex align-items-center justify-content-center"
            style="border-radius:50%;width:60px;height:60px;bottom:20px;right:20px;z-index:9998;display:flex;">

        <i class="bi bi-chat-dots-fill fs-4"></i>

    </button>

    <script>

        function formatearMensaje(texto) {
            // Convertir **texto** en <strong>texto</strong>
            return texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
        }

        function cerrarChat() {
            document.getElementById("chatWidget").style.display = "none";
            document.getElementById("openChatBtn").style.display = "flex";
        }

        function abrirChat() {
            document.getElementById("chatWidget").style.display = "block";
            document.getElementById("openChatBtn").style.display = "none";
            // Cargar mensajes al abrir el chat
            cargarMensajes();
        }

function toggleMinimizar() {
            const widget = document.getElementById("chatWidget");
            const btn = document.getElementById("btnMinimizar");
            const icon = document.getElementById("iconMinimizar");

            widget.classList.toggle("minimized");

            if (widget.classList.contains("minimized")) {
                if (icon) icon.className = "bi bi-plus-lg";
                if (btn) btn.title = "Expandir";
            } else {
                if (icon) icon.className = "bi bi-dash-lg";
                if (btn) btn.title = "Minimizar";
            }
        }

        function cargarMensajes() {
            const chatMessagesEl = document.getElementById("chatMessages");
            const loadingEl = document.getElementById("chatLoading");

            fetch("{% url 'chat_ia' %}")
                .then(response => response.json())
                .then(data => {
                    // Ocultar loading
                    if (loadingEl) loadingEl.style.display = "none";

                    if (data.chat && data.chat.length > 0) {
                        chatMessagesEl.innerHTML = "";
                        data.chat.forEach(msg => {
                            if (msg.rol === "user") {
                                chatMessagesEl.innerHTML += `
                                    <div class="msg-user align-self-end mb-3">
                                        <div class="msg-user-text">${formatearMensaje(msg.texto)}</div>
                                    </div>
                                `;
                            } else {
                                chatMessagesEl.innerHTML += `
                                    <div class="msg-ia align-self-start mb-3">
                                        <div class="d-flex align-items-start gap-2">
                                            <div class="msg-ia-avatar flex-shrink-0">
                                                <i class="bi bi-robot-fill"></i>
                                            </div>
                                            <div class="msg-ia-text">${formatearMensaje(msg.texto)}</div>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
                    }
                })
                .catch(error => {
                    console.error("Error al cargar mensajes:", error);
                    if (loadingEl) {
                        loadingEl.innerHTML = '<p class="text-muted small">Error al conectar. Intenta de nuevo.</p>';
                    }
                });
        }

        document.addEventListener("DOMContentLoaded", function(){
            const chatFormEl = document.getElementById("chatForm");
            const chatMessagesEl = document.getElementById("chatMessages");
            const openBtn = document.getElementById("openChatBtn");
            const input = document.getElementById("pregunta");

            if(chatFormEl){
                chatFormEl.addEventListener("submit", function(e){
                    e.preventDefault();

                    const formData = new FormData(this);

                    if(!input.value.trim()) return;

                    // Mostrar mensaje del usuario inmediatamente
                    const loadingDiv = document.getElementById("chatLoading");
                    if (loadingDiv) loadingDiv.style.display = "none";

                    chatMessagesEl.innerHTML += `
                        <div class="msg-user align-self-end mb-3">
                            <div class="msg-user-text">${formatearMensaje(input.value)}</div>
                        </div>
                    `;

                    const userMsg = input.value;
                    input.value = "";
                    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;

                    // Mostrar indicador de escritura
                    chatMessagesEl.innerHTML += `
                        <div class="msg-ia align-self-start mb-3" id="typingIndicator">
                            <div class="d-flex align-items-start gap-2">
                                <div class="msg-ia-avatar flex-shrink-0">
                                    <i class="bi bi-robot-fill"></i>
                                </div>
                                <div class="msg-ia-text">
                                    <span class="typing-dots">
                                        <span>.</span><span>.</span><span>.</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;

                    fetch("{% url 'chat_ia' %}", {
                        method: "POST",
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        // Remover indicador de escritura
                        const typingEl = document.getElementById("typingIndicator");
                        if (typingEl) typingEl.remove();

                        if(data.nuevo_mensaje){
                            chatMessagesEl.innerHTML += `
                                <div class="msg-ia align-self-start mb-3">
                                    <div class="d-flex align-items-start gap-2">
                                        <div class="msg-ia-avatar flex-shrink-0">
                                            <i class="bi bi-robot-fill"></i>
                                        </div>
                                        <div class="msg-ia-text">${formatearMensaje(data.nuevo_mensaje)}</div>
                                    </div>
                                </div>
                            `;
                            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
                        }
                    })
                    .catch(error => {
                        const typingEl = document.getElementById("typingIndicator");
                        if (typingEl) typingEl.remove();
                        console.error(error);
                    });
                });
            }

            // Permitir enviar con Enter
            if (input) {
                input.addEventListener("keydown", function(e) {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        chatFormEl.dispatchEvent(new Event("submit"));
                    }
                });
            }
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ========================= -->
    <!-- CONTADOR CARRITO -->
    <!-- ========================= -->

    <script>

        (function(){

            function actualizarContadorCarrito(){

                var carrito = JSON.parse(localStorage.getItem("carrito")) || [];

                var contador = document.getElementById("contador");

                if(!contador) return;

                var cantidad = 0;

                carrito.forEach(function(item){

                    cantidad += item.cantidad || 1;

                });

                if(cantidad > 0){

                    contador.textContent = cantidad;
                    contador.style.display = "inline-block";

                }else{

                    contador.style.display = "none";

                }

            }

            actualizarContadorCarrito();

            window.addEventListener("storage", function(e){

                if(e.key === "carrito"){

                    actualizarContadorCarrito();

                }

            });

        })();

    </script>

</body>
</html>
