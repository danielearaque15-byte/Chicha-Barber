{% extends 'base-admin.html' %}
{% load static %}

{% block content %}

<div class="container py-4">

    <!-- ENCABEZADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                Registrar Adquisición
            </h2>

            <p class="text-muted mb-0">
                Registra la entrada de productos adquiridos a un proveedor.
            </p>
        </div>

        <a href="{% url 'lista_adquisiciones' %}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-1"></i>
            Volver

        </a>

    </div>


    <!-- FORMULARIO -->
    <div class="card shadow border-0">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                <div class="row g-4">


                    <!-- PROVEEDOR -->
                    <div class="col-md-6">

                        <label for="proveedor_id"
                               class="form-label fw-bold">

                            Proveedor

                        </label>

                        <select name="proveedor_id"
                                id="proveedor_id"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione un proveedor
                            </option>

                            {% for proveedor in proveedores %}

                                <option value="{{ proveedor.pk }}">

                                    {{ proveedor.nombre }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- PRODUCTO -->
                    <div class="col-md-6">

                        <label for="producto_id"
                               class="form-label fw-bold">

                            Producto

                        </label>

                        <select name="producto_id"
                                id="producto_id"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione un producto
                            </option>

                            {% for producto in productos %}

                                <option value="{{ producto.codigo_producto }}">

                                    {{ producto.nombre }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- CANTIDAD -->
                    <div class="col-md-4">

                        <label for="cantidad"
                               class="form-label fw-bold">

                            Cantidad

                        </label>

                        <input type="number"
                               name="cantidad"
                               id="cantidad"
                               class="form-control"
                               min="1"
                               value="1"
                               required>

                    </div>


                    <!-- PRECIO COMPRA -->
                    <div class="col-md-4">

                        <label for="precio_compra"
                               class="form-label fw-bold">

                            Precio de compra

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                $
                            </span>

                            <input type="number"
                                   name="precio_compra"
                                   id="precio_compra"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   placeholder="0.00"
                                   required>

                        </div>

                    </div>


                    <!-- FECHA -->
                    <div class="col-md-4">

                        <label for="fecha"
                               class="form-label fw-bold">

                            Fecha

                        </label>

                        <input type="date"
                               name="fecha"
                               id="fecha"
                               class="form-control"
                               required>

                    </div>


                    <!-- TOTAL -->
                    <div class="col-12">

                        <div class="bg-light border rounded p-3">

                            <div class="d-flex justify-content-between align-items-center">

                                <span class="fw-bold">
                                    Total adquisición
                                </span>

                                <span id="total"
                                      class="fs-4 fw-bold text-primary">

                                    $0

                                </span>

                            </div>

                        </div>

                    </div>


                </div>


                <!-- BOTONES -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">

                    <a href="{% url 'lista_adquisiciones' %}"
                       class="btn btn-outline-secondary">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="btn color-azul text-white fw-bold">

                        <i class="bi bi-plus-circle me-1"></i>

                        Registrar Adquisición

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

document.addEventListener('DOMContentLoaded', function () {

    const cantidad = document.getElementById('cantidad');
    const precio = document.getElementById('precio_compra');
    const total = document.getElementById('total');


    function calcularTotal() {

        const cantidadValor = parseFloat(cantidad.value) || 0;
        const precioValor = parseFloat(precio.value) || 0;

        const resultado = cantidadValor * precioValor;

        total.textContent = '$' + resultado.toLocaleString('es-CO');

    }


    cantidad.addEventListener('input', calcularTotal);

    precio.addEventListener('input', calcularTotal);

});

</script>

{% endblock scripts %}
